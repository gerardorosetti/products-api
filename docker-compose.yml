name: products-api

services:
  app:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-products_api}
      DB_USERNAME: ${DB_USERNAME:-products_api}
      DB_PASSWORD: ${DB_PASSWORD:-products_api}
      APP_SEED: ${APP_SEED:-true}
    volumes:
      # Source is bind-mounted for live editing. vendor/ is a named volume that is
      # populated from the image on first start, so the host needs no vendor/ (or PHP/Composer) at all.
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-products_api}
      POSTGRES_USER: ${DB_USERNAME:-products_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-products_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vendor:
  pgdata:
