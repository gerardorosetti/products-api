version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Moving the image to a new PHP version is a deliberate change (Dockerfile, docs and CI together).
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
