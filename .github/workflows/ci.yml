name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: products_api
          POSTGRES_PASSWORD: products_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U products_api -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: testing
      DB_USERNAME: products_api
      DB_PASSWORD: products_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test --compact

      - name: Run tests with coverage gate (90%)
        if: matrix.php == '8.4'
        run: php artisan test --coverage --min=90

  standalone:
    name: Standalone mode (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run zero-config setup
        run: composer setup

      - name: Start the development server
        run: php artisan serve --port=8000 > serve.log 2>&1 &

      - name: Wait for the API
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          cat serve.log
          exit 1

      - name: Smoke test (login and list products)
        run: |
          token=$(curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"Password123!"}' | jq -r '.data.token')
          test -n "$token" && test "$token" != "null"
          curl -fsS http://localhost:8000/api/products \
            -H 'Accept: application/json' -H "Authorization: Bearer $token"

      - name: Print server log on failure
        if: failure()
        run: cat serve.log

  security:
    name: Security (audit and secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Scan history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact

  docker:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Wait for the API through nginx
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Smoke test (admin and viewer)
        run: |
          login() {
            curl -fsS -X POST http://localhost:8080/api/auth/login \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -d "{\"email\":\"$1\",\"password\":\"Password123!\"}" | jq -r '.data.token'
          }
          admin_token=$(login admin@example.com)
          viewer_token=$(login viewer@example.com)
          test -n "$admin_token" && test "$admin_token" != "null"
          test -n "$viewer_token" && test "$viewer_token" != "null"

          curl -fsS http://localhost:8080/api/products \
            -H 'Accept: application/json' -H "Authorization: Bearer $admin_token"

          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/products \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $viewer_token" -d '{}')
          echo "Viewer POST /api/products -> $status"
          test "$status" = "403"

      - name: Run the Postman collection (Newman)
        run: |
          docker compose exec -T app php artisan migrate:fresh --seed --force
          docker run --rm --network products-api_default \
            -v "$PWD/docs/postman:/etc/newman" postman/newman:6-alpine \
            run products-api.postman_collection.json \
            -e local.postman_environment.json \
            --env-var base_url=http://nginx/api

      - name: Check that docs/openapi.json is up to date
        run: |
          docker compose exec -T app php artisan scramble:export --path=docs/openapi.json
          git diff --exit-code -- docs/openapi.json

      - name: Build production image
        run: docker build --target prod .

      - name: Print stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
