server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 1m;

    # Resolve the app container through Docker's DNS on each request, so recreating
    # the app container does not leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # API responses are JSON only; the docs UI (/docs/api) needs inline scripts/styles, so no CSP there.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    charset utf-8;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /docs {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
