# The API only returns JSON, so it gets the strictest Content-Security-Policy.
# The API documentation UI (/docs, /_scramble) renders HTML with inline scripts
# and styles, so no CSP is sent for it. The decision is made on the original URI
# because PHP responses are served from the "\.php$" location after try_files.
map $request_uri $content_security_policy {
    default         "default-src 'none'; frame-ancestors 'none'";
    ~^/docs(/|$)    "";
    ~^/_scramble/   "";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 1m;

    # Resolve the app container through Docker's DNS on each request, so recreating
    # the app container does not leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # nginx omits the header when the value is empty (documentation routes).
    add_header Content-Security-Policy $content_security_policy always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    charset utf-8;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}
